name = "sfb-valuation"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
WM_KEY_VERSION = "1"

# Public live price check (GET /v1/price/<gtin>). Two limits, both charged only when a Walmart call is made:
# 30 per caller (IP) per minute, and 60 Walmart calls per minute in total so the shared key (also used by the
# crawler) can never be exhausted from the app. namespace_id must be unique per account; any small integer works.
# Without these bindings the route answers 503 (it fails closed).
[[ratelimits]]
name = "PRICE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "PRICE_GLOBAL_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
